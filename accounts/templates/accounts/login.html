
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #d0d5dd;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #344f6d;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            background: #fee4e2;
            color: #b42318;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #667085;
        }

        a {
            color: #243b55;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>FocusFlow</h1>
    <p class="subtitle">Welcome back! Log in to your account.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">Login</button>
    </form>

    <p class="register-link">
        Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>

</div>

</body>
</html>
