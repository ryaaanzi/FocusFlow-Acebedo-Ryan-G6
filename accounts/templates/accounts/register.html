
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FocusFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #26364a;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .messages {
            margin-bottom: 15px;
        }

        .message {
            padding: 10px;
            border-radius: 6px;
            background: #e8f7ed;
            color: #236b3c;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .errorlist {
            color: #c0392b;
            font-size: 13px;
            margin: 5px 0 10px 18px;
        }

        form p {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d5dbe3;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #3978d4;
        }

        .helptext {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #3978d4;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #2863b5;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        a {
            color: #3978d4;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>FocusFlow</h1>
        <p class="subtitle">Create your account and start managing your screen time.</p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Create Account</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </p>

    </div>

</body>
</html>
